<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../icons/icon32.png">
<title>MatchFetch</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: #0f1724;
    color: #f1f5f9; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 48px 16px;
}
.welcome { max-width: 560px; width: 100%; }
.hero { text-align: center; margin-bottom: 36px; }
.hero-icon { display: flex; justify-content: center; margin-bottom: 20px; }
.hero-icon img { width: 80px; height: 80px; display: block; }
.hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
.hero p { font-size: 14px; color: #94a3b8; line-height: 1.7; max-width: 480px; margin: 0 auto; }
.services { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; }
.service-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: #1a2332; border: 1px solid #253044; border-radius: 999px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; color: #e2e8f0;
}
.service-pill svg { display: block; }
.steps-title { text-align: center; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 16px; }
.steps { display: flex; flex-direction: column; gap: 12px; }
.step {
    display: flex; align-items: center; gap: 16px; text-align: left;
    background: #1a2332; border: 1px solid #253044; border-radius: 12px; padding: 16px 18px;
    transition: border-color .2s, background .2s;
}
.step:hover { border-color: #3b82f6; background: #1e2a3a; }
.step-num {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0f1724; border: 1px solid #253044;
    font-size: 14px; font-weight: 700; color: #60a5fa;
}
.step-icon {
    width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0f1724; border: 1px solid #253044; color: #94a3b8;
}
.step-icon img { width: 28px; height: 28px; border-radius: 5px; display: block; }
.step-body { flex: 1; }
.step-title { font-size: 14px; font-weight: 600; color: #f1f5f9; }
</style>
</head>
<body>
<div class="welcome">
    <div class="hero">
        <div class="hero-icon"><img src="../icons/logo.png" alt="MatchFetch"></div>
        <h1>Thank you for installing MatchFetch</h1>
        <p>Fetch and explore your DNA matches.</p>
        <div class="services">
            <span class="service-pill"><svg viewBox="0 0 250 190" width="18" height="14"><path d="M150.82 33.292c-17.654-19.168-35.307-16.14-38.334-15.637 1.513.504 3.027 33.796 21.69 51.45 12.61 11.6 38.335 7.565 38.335 7.565s-4.54-24.715-21.69-43.378m21.187 65.07c-5.55 0-28.248 2.018-43.38 20.68-15.637 19.673-15.133 35.31-18.664 38.84 3.027 1.01 34.805 4.035 48.424-16.645 13.114-19.17 13.62-39.85 13.62-42.876M33.797 84.74c3.53.506 15.637 16.143 37.327 18.16 23.707 2.524 31.777-9.582 32.283-9.582 0-1.514-19.168-22.194-40.353-22.194-14.63.503-29.257 13.617-29.257 13.617m86.254 10.594c-.504.504-20.175 26.734-66.582 19.672C16.142 108.954 2.523 88.272 0 87.768c3.027-4.036 31.275-26.734 64.06-26.23 32.284 1.01 55.99 19.168 55.99 19.168h20.68c-16.644-5.044-36.82-14.123-45.9-34.3-8.07-18.662-6.557-29.76-10.088-45.396 0 0 37.326-3.027 66.078 15.636 26.23 17.15 40.857 62.547 41.362 64.06h16.14L204.793 0l20.176.504c-3.53 21.186 1.01 172.51 0 172.51-2.017.503-19.168 1.51-20.68-2.524 0 0 4.035-74.148 4.54-75.662H193.19c0 1.01-1.513 42.875-33.29 65.07-31.78 22.194-77.68 15.636-77.68 15.636 5.55-8.575 0-17.654 16.14-42.37 18.664-28.247 43.38-38.336 42.877-38.336-1.513.506-20.68.506-21.186.506" fill="#9CBE30"/></svg> AncestryDNA</span>
            <span class="service-pill"><svg viewBox="0 0 90 180" width="9" height="18"><path d="M62.6275 8.07027C66.129 0.920008 74.7828-2.0301 81.936 1.48003 89.0891 4.99016 92.0304 13.6305 88.5189 20.7807L51.7427 95.6734 39.4273 55.302 62.6275 8.07027ZM8.07352 151.855C.920379 148.345-2.03092 139.705 1.48063 132.555L20.8191 93.1833 33.1345 133.555 27.382 145.265c-3.5115 7.15-12.1553 10.101-19.30848 6.59z" fill="#92C746"/><path d="M20.8191 93.1834L33.1345 133.565 51.7427 95.6735 39.4273 55.302z" fill="#3BA510"/><path d="M13.3156 19.1407C20.939 16.8206 29.0025 21.1107 31.3235 28.731L39.4271 55.302 20.8189 93.1933 3.72142 37.1413c-2.32102-7.6203 1.97086-15.6806 9.59418-18.0006zM62.1973 179.366c-7.6234 2.331-15.6869-1.96-18.0079-9.58L33.1345 133.555 51.7427 95.6634 71.7915 161.366c2.321 7.62-1.9709 15.68-9.5942 18z" fill="#D50F67"/></svg> 23andMe</span>
        </div>
    </div>
    <div class="steps-title">Get started</div>
    <div class="steps">
        <div class="step">
            <div class="step-num">1</div>
            <div class="step-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg></div>
            <div class="step-body">
                <div class="step-title">Open the Extensions menu</div>
            </div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div class="step-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg></div>
            <div class="step-body">
                <div class="step-title">Pin MatchFetch to your toolbar</div>
            </div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div class="step-icon"><img src="../icons/logo.png" alt=""></div>
            <div class="step-body">
                <div class="step-title">Access MatchFetch via this icon</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
